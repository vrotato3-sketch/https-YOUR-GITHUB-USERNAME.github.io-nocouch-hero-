<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NoCouch — hero animation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #060806;
    --bg-2: #0C120D;
    --ink: #EAF5EE;
    --ink-dim: #7C9186;
    --green: #59FF95;
    --green-mid: #2BAF63;
    --green-dim: #123322;
    --line: rgba(234,245,238,0.10);
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0; padding:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Space Grotesk', sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  .hero{
    position:relative;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    padding: 8vh 6vw 6vh;
    background: radial-gradient(120% 70% at 50% -10%, var(--bg-2) 0%, var(--bg) 62%);
  }

  /* --- Ring / readiness gauge --- */
  .gauge-wrap{
    position:relative;
    width: 220px;
    height: 220px;
    opacity:0;
    animation: fadeIn .3s ease forwards;
  }
  @keyframes fadeIn{ to{ opacity:1; } }

  svg.gauge{ width:100%; height:100%; transform: rotate(-90deg); overflow: visible; }

  .tick{ stroke: var(--line); stroke-width:1.5; }

  .track{
    fill:none;
    stroke: rgba(234,245,238,0.08);
    stroke-width: 3;
  }

  .arc{
    fill:none;
    stroke: var(--green);
    stroke-width: 3;
    stroke-linecap: round;
    stroke-dasharray: 502.4;
    stroke-dashoffset: 502.4;
    animation: sweep 1.3s cubic-bezier(.45,0,.15,1) forwards;
    animation-delay: .35s;
    filter: drop-shadow(0 0 6px rgba(89,255,149,0.55));
  }
  @keyframes sweep{ to{ stroke-dashoffset: 40.2; } }

  .gauge-center{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:2px;
  }

  .score{
    font-size: 3.1rem;
    font-weight:600;
    line-height:1;
    font-variant-numeric: tabular-nums;
    display:flex;
    align-items:flex-start;
  }
  .score sup{ font-size:1.2rem; margin-top:6px; color: var(--ink-dim); font-weight:500; }

  .score-label{
    font-size:.72rem;
    color: var(--ink-dim);
    letter-spacing: .04em;
  }

  .wave{
    width: 84px; height: 20px;
    margin-top:6px;
  }
  .wave path{
    fill:none;
    stroke: var(--green-mid);
    stroke-width:1.6;
    stroke-linecap:round;
    stroke-linejoin:round;
    stroke-dasharray: 160;
    stroke-dashoffset:160;
    animation: waveDraw 1.1s ease forwards;
    animation-delay: .5s;
  }
  @keyframes waveDraw{ to{ stroke-dashoffset:0; } }

  .burst{
    position:absolute;
    inset:0;
    border-radius:50%;
    box-shadow: 0 0 0 0 rgba(89,255,149,0);
    animation: burst .5s ease-out forwards;
    animation-delay: 1.55s;
  }
  @keyframes burst{
    0%{ box-shadow: 0 0 0 0 rgba(89,255,149,0.5); }
    100%{ box-shadow: 0 0 0 40px rgba(89,255,149,0); }
  }

  /* --- Wordmark w/ glitch reveal --- */
  .wordmark-wrap{
    position:relative;
    margin-top: 30px;
    height: 4.6rem;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  h1.wordmark{
    font-family:'Bebas Neue', sans-serif;
    font-size: clamp(2.8rem, 8vw, 5rem);
    letter-spacing: .02em;
    margin:0;
    line-height:1;
    color: var(--ink);
    position:relative;
    opacity:0;
  }
  h1.wordmark span{ color: var(--green); }

  .wm-base{
    animation: wmIn .08s steps(1) forwards;
    animation-delay: 1.78s;
  }
  @keyframes wmIn{ to{ opacity:1; } }

  .wm-ghost{
    position:absolute;
    top:0; left:0; right:0;
    text-align:center;
    opacity:0;
  }
  .wm-ghost-r{
    color: #FF4D6A;
    animation: ghostR .3s steps(2) forwards;
    animation-delay: 1.7s;
  }
  .wm-ghost-g{
    color: var(--green);
    animation: ghostG .3s steps(2) forwards;
    animation-delay: 1.7s;
  }
  @keyframes ghostR{
    0%{ opacity:.8; transform: translate(-3px,1px); }
    40%{ opacity:.6; transform: translate(2px,-1px); }
    100%{ opacity:0; transform: translate(0,0); }
  }
  @keyframes ghostG{
    0%{ opacity:.8; transform: translate(3px,-1px); }
    40%{ opacity:.6; transform: translate(-2px,1px); }
    100%{ opacity:0; transform: translate(0,0); }
  }

  .tagline{
    margin: 6px 0 0;
    color: var(--ink-dim);
    font-size: 1rem;
    opacity:0;
    animation: fadeUp .4s ease forwards;
    animation-delay: 2.0s;
  }
  @keyframes fadeUp{ from{ opacity:0; transform:translateY(6px);} to{ opacity:1; transform:translateY(0);} }

  /* --- Stats row --- */
  .stats-row{
    display:flex;
    gap: 12px;
    margin-top: 30px;
    flex-wrap: wrap;
    justify-content:center;
  }
  .stat{
    display:flex;
    flex-direction:column;
    gap:2px;
    padding: 10px 16px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: rgba(89,255,149,0.03);
    opacity:0;
    transform: translateY(8px);
    animation: statIn .4s cubic-bezier(.3,0,.2,1) forwards;
  }
  .stat:nth-child(1){ animation-delay: 2.15s; }
  .stat:nth-child(2){ animation-delay: 2.27s; }
  .stat:nth-child(3){ animation-delay: 2.39s; }
  @keyframes statIn{ to{ opacity:1; transform:translateY(0);} }

  .stat-val{ font-size:.95rem; font-weight:600; font-variant-numeric: tabular-nums; }
  .stat-label{ font-size:.72rem; color:var(--ink-dim); }

  .cta{
    margin-top: 32px;
    font-family:'Space Grotesk', sans-serif;
    font-size: .95rem;
    font-weight:600;
    color: var(--bg);
    background: var(--green);
    border:none;
    padding: 13px 28px;
    border-radius: 8px;
    cursor:pointer;
    opacity:0;
    transform: translateY(8px);
    animation: statIn .45s cubic-bezier(.3,0,.2,1) forwards;
    animation-delay: 2.6s;
    transition: transform .15s ease, filter .15s ease;
  }
  .cta:hover{ filter: brightness(1.1); transform: translateY(0) scale(1.02); }

  @media (max-width: 600px){
    .hero{
      min-height: 100svh;
      padding: 6vh 18px 28px;
      justify-content: space-between;
    }
    .gauge-wrap{
      width: 156px;
      height: 156px;
      margin-top: 2vh;
    }
    .score{ font-size: 2.45rem; }
    .score-label{ font-size: .65rem; }
    .wordmark-wrap{
      margin-top: 16px;
      height: 3.6rem;
    }
    h1.wordmark{ font-size: clamp(2.8rem, 16vw, 4rem); }
    .tagline{
      max-width: 260px;
      margin-left: auto;
      margin-right: auto;
      text-align: center;
      font-size: .88rem;
    }
    .stats-row{
      width: 100%;
      gap: 7px;
      margin-top: 20px;
    }
    .stat{
      flex: 1 1 0;
      min-width: 0;
      padding: 9px 5px;
      text-align: center;
      background: rgba(89,255,149,0.06);
    }
    .stat-val{ font-size: .78rem; }
    .stat-label{ font-size: .63rem; }
    .cta{
      width: min(100%, 320px);
      min-height: 48px;
      margin-top: 20px;
      border-radius: 999px;
    }
  }

  /* Alternate scan-and-lock entrance */
  .gauge-wrap{
    --scan-distance:218px;
    animation: gaugeLock .8s cubic-bezier(.16,1,.3,1) both;
  }
  .gauge-wrap::after{
    content:"";
    position:absolute;
    left:8%;
    right:8%;
    top:0;
    height:2px;
    border-radius:999px;
    background:var(--green);
    box-shadow:0 0 14px var(--green), 0 0 32px rgba(89,255,149,.65);
    animation: scanGauge 1.05s .15s cubic-bezier(.45,0,.15,1) both;
  }
  .arc{
    animation: arcLock 1.1s .2s cubic-bezier(.45,0,.15,1) forwards;
  }
  .wm-ghost{ display:none; }
  .wm-base{
    animation: wordLock .65s .95s cubic-bezier(.16,1,.3,1) both;
  }
  .tagline{ animation: readyIn .45s 1.28s ease both; }
  .stat:nth-child(1){ animation-delay:1.45s; }
  .stat:nth-child(2){ animation-delay:1.55s; }
  .stat:nth-child(3){ animation-delay:1.65s; }
  .cta{ animation-delay:1.85s; }
  @keyframes gaugeLock{
    from{ opacity:0; transform:scale(.78); }
    70%{ opacity:1; transform:scale(1.04); }
    to{ opacity:1; transform:scale(1); }
  }
  @keyframes scanGauge{
    from{ opacity:0; transform:translateY(0); }
    15%{ opacity:1; }
    to{ opacity:0; transform:translateY(var(--scan-distance)); }
  }
  @keyframes arcLock{
    from{ stroke-dashoffset:502.4; opacity:.2; }
    55%{ stroke-dashoffset:115; opacity:1; }
    to{ stroke-dashoffset:40.2; opacity:1; }
  }
  @keyframes wordLock{
    from{ opacity:0; clip-path:inset(0 100% 0 0); transform:translateX(-8px); }
    to{ opacity:1; clip-path:inset(0 0 0 0); transform:translateX(0); }
  }
  @keyframes readyIn{
    from{ opacity:0; transform:translateY(8px); letter-spacing:.18em; }
    to{ opacity:1; transform:translateY(0); letter-spacing:0; }
  }
  @media (max-width: 600px){
    .gauge-wrap{ --scan-distance:154px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.01ms !important; animation-delay:0s !important; }
    .arc{ stroke-dashoffset: 40.2 !important; }
    .wave path{ stroke-dashoffset:0 !important; }
    h1.wordmark{ opacity:1 !important; }
    .wm-ghost{ display:none !important; }
    .burst{ display:none !important; }
  }
</style>
</head>
<body>

<section class="hero">

  <div class="gauge-wrap">
    <svg class="gauge" viewBox="0 0 180 180">
      <circle class="track" cx="90" cy="90" r="80"/>
      <circle class="arc" cx="90" cy="90" r="80"/>
    </svg>
    <div class="burst"></div>
    <div class="gauge-center">
      <div class="score"><span id="scoreNum">0</span><sup>%</sup></div>
      <div class="score-label">Ready to train</div>
      <svg class="wave" viewBox="0 0 84 20">
        <path d="M0,10 L18,10 L24,3 L30,17 L36,10 L84,10" />
      </svg>
    </div>
  </div>

  <div class="wordmark-wrap">
    <h1 class="wordmark wm-ghost wm-ghost-r">No<span>Couch</span></h1>
    <h1 class="wordmark wm-ghost wm-ghost-g">No<span>Couch</span></h1>
    <h1 class="wordmark wm-base">No<span>Couch</span></h1>
  </div>

  <p class="tagline">Your AI coach for calories, macros, and momentum.</p>

  <div class="stats-row">
    <div class="stat">
      <span class="stat-val">2,140 kcal</span>
      <span class="stat-label">Calories</span>
    </div>
    <div class="stat">
      <span class="stat-val">168 g</span>
      <span class="stat-label">Protein</span>
    </div>
    <div class="stat">
      <span class="stat-val">2.4 L</span>
      <span class="stat-label">Water</span>
    </div>
  </div>

  <button class="cta">Get today's plan</button>

</section>

<script>
  (function(){
    const el = document.getElementById('scoreNum');
    const target = 92;
    const start = performance.now() + 350;
    const duration = 1300;

    function tick(now){
      const t = now - start;
      if (t < 0){ requestAnimationFrame(tick); return; }
      const p = Math.min(t / duration, 1);
      const eased = 1 - Math.pow(1 - p, 2.4);
      el.textContent = Math.round(eased * target);
      if (p < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);

    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches){
      el.textContent = target;
    }
  })();
</script>

</body>
</html>
